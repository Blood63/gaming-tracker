name: Partie COD Mobile
description: Envoie la capture de fin de partie, les stats sont lues automatiquement.
title: "COD Mobile – partie"
labels: ["cod-mobile"]
body:
  - type: textarea
    id: capture
    attributes:
      label: Capture d'écran
      description: Glisse ici la capture du tableau des scores (une ou plusieurs images).
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: "Date de la partie (optionnel, AAAA-MM-JJ HH:MM)", placeholder: "vide = date de l'issue" }
  - type: dropdown
    id: type
    attributes: { label: Type de partie, options: ["Multijoueur", "Battle Royale"] }
  - type: dropdown
    id: ranked
    attributes: { label: "Classée ?", options: ["Oui", "Non"] }
  - type: input
    id: mode
    attributes: { label: Mode (correction), placeholder: "ex. Team Deathmatch" }
  - type: input
    id: map
    attributes: { label: Carte (correction), placeholder: "ex. Nuketown" }
  - type: dropdown
    id: result
    attributes: { label: Résultat (correction), options: ["Victoire", "Défaite", "Égalité"] }
  - type: input
    id: kills
    attributes: { label: Éliminations (correction) }
  - type: input
    id: deaths
    attributes: { label: Morts (correction) }
  - type: input
    id: assists
    attributes: { label: Assistances (correction) }
  - type: input
    id: score
    attributes: { label: Score (correction) }
  - type: input
    id: placement
    attributes: { label: Classement BR (correction), placeholder: "ex. 3 (pour Top 3)" }
  - type: input
    id: damage
    attributes: { label: Dégâts (correction) }
  - type: input
    id: survival
    attributes: { label: Temps de survie BR (correction), placeholder: "ex. 18:42" }
