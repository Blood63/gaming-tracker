name: Changement de rang COD
description: "À utiliser depuis l'app (page COD › Enregistrer un changement de rang). Ce formulaire reste un secours."
title: "COD Mobile – rang"
labels: ["cod-rank"]
body:
  - type: markdown
    attributes: { value: "Le plus simple : saisis ton rang directement dans l'app, puis « Synchroniser »." }
  - type: dropdown
    id: mode
    attributes: { label: Mode, options: ["Multijoueur", "Battle Royale"] }
  - type: dropdown
    id: tier
    attributes: { label: Rang, options: ["Novice", "Vétéran", "Élite", "Pro", "Maître", "Grand Maître", "Légendaire"] }
  - type: dropdown
    id: sub
    attributes: { label: "Division (Novice à Pro uniquement)", options: ["I", "II", "III", "IV", "V"] }
  - type: input
    id: points
    attributes: { label: Points (optionnel) }
  - type: input
    id: date
    attributes: { label: "Date (optionnel, AAAA-MM-JJ HH:MM)" }
