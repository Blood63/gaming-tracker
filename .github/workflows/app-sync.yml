name: Synchro app
# Synchro « un geste » : l'app envoie un repository_dispatch (type gt-sync) avec un jeton GitHub à grain fin
# (dépôt Blood63/gaming-tracker uniquement, Contents : lecture/écriture), stocké seulement sur l'appareil.
# Les éléments passent par les mêmes scripts d'intégration que les issues (validations + fusion idempotente).
on:
  repository_dispatch:
    types: [gt-sync]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor == 'Blood63'
    runs-on: ubuntu-latest
    concurrency: { group: data-commit, cancel-in-progress: false, queue: max }
    steps:
      - uses: actions/checkout@v5
      # File partagée « data-commit » (queue: max) + publication vérifiée : 5 essais sur la dernière version de main,
      # check_data.py, commit présent sur origin/main ; sinon job rouge (l'app garde les éléments en attente).
      - env:
          GT_ITEMS: ${{ toJSON(github.event.client_payload.items) }}
          TZ: Europe/Paris
          ADD: "goals.json cod_mobile.json cod_ranks.json cod_profile.json rocket_league.json"
          REGEN: "python3 tools/app_sync.py"
        run: |
          MSG="Synchro app" bash tools/push_data.sh
          if grep -q '"ok": false' sync_result.json; then echo "::error::Au moins un élément refusé (voir le détail ci-dessus)"; exit 1; fi
