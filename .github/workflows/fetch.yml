name: Fetch stats
on:
  schedule:
    - cron: "0 18 * * 0"   # dimanche 20:00 Paris (heure d'été) / 19:00 (hiver)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TRN_API_KEY: ${{ secrets.TRN_API_KEY }}
          TZ: Europe/Paris
      - run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A history *_latest.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -I)"
          git push
