name: Fetch stats
on:
  schedule:
    - cron: "0 18 * * 0"   # 20:00 Paris en été (CEST)
    - cron: "0 19 * * 0"   # 20:00 Paris en hiver (CET)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          off=$(TZ=Europe/Paris date +%z); s="${{ github.event.schedule }}"
          if [ -z "$s" ] || { [ "$s" = "0 18 * * 0" ] && [ "$off" = "+0200" ]; } || { [ "$s" = "0 19 * * 0" ] && [ "$off" = "+0100" ]; }; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        run: python3 fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TRN_API_KEY: ${{ secrets.TRN_API_KEY }}
          TZ: Europe/Paris
      - if: steps.gate.outputs.run == 'true'
        run: python3 tools/fetch_store.py || echo "store fetch failed"
      - if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A history *_latest.json store.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -I)"
          git pull --rebase -q && git push
