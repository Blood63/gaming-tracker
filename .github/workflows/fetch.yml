name: Fetch stats
# Relevé Steam (+ boutique, succès, ballchasing) visé mercredi et dimanche à 00:00 heure de Paris.
# Premier passage 20:43 la veille ; secours 00:43 le jour même, sauté si un relevé de ce créneau existe déjà.
# 2 crons par passage (été/hiver), filtrés par tools/cron_gate.py.
on:
  schedule:
    - cron: "43 18 * * 2"
    - cron: "43 18 * * 6"
    - cron: "43 19 * * 2"
    - cron: "43 19 * * 6"
    - cron: "43 22 * * 2"
    - cron: "43 22 * * 6"
    - cron: "43 23 * * 2"
    - cron: "43 23 * * 6"
  workflow_dispatch:
    inputs:
      only:
        description: "'achievements' = seulement les succès Steam détaillés (aucun relevé d'historique)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: season
        env:
          TZ: Europe/Paris
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 tools/cron_gate.py --kind steam --phase season
      - id: slot
        if: steps.season.outputs.run == 'true' && inputs.only != 'achievements'
        env:
          TZ: Europe/Paris
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 tools/cron_gate.py --kind steam --phase slot --file history/steam.jsonl --slot "${{ steps.season.outputs.slot }}"
      - if: steps.season.outputs.run == 'true' && steps.slot.outputs.skip != 'true' && inputs.only != 'achievements'
        run: python3 fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          TZ: Europe/Paris
      - if: steps.season.outputs.run == 'true' && steps.slot.outputs.skip != 'true' && inputs.only != 'achievements'
        run: python3 tools/fetch_store.py || echo "store fetch failed"
      - if: steps.season.outputs.run == 'true' && steps.slot.outputs.skip != 'true' && inputs.only != 'achievements'
        run: python3 tools/fetch_ballchasing.py || echo "ballchasing failed"
        env:
          BALLCHASING_API_KEY: ${{ secrets.BALLCHASING_API_KEY }}
          TZ: Europe/Paris
      - if: steps.season.outputs.run == 'true' && (steps.slot.outputs.skip != 'true' || inputs.only == 'achievements')
        run: python3 tools/fetch_steam_ach.py || echo "steam achievements failed"
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - if: steps.season.outputs.run == 'true' && (steps.slot.outputs.skip != 'true' || inputs.only == 'achievements')
        run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/build_home.py
          git add -A history *_latest.json store.json valorant.json ballchasing_latest.json steam_achievements.json home.json build.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -I)"
          git pull --rebase -q && git push
