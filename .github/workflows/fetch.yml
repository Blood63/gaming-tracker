name: Fetch stats
# Relevé Steam (+ boutique, succès, ballchasing) visé mercredi et dimanche à 00:00 heure de Paris (2 crons par créneau : été/hiver, filtrés par « gate »).
# Déclenché à une minute creuse (:43), 17 min avant minuit : GitHub retarde les crons de 1 h à 3 h, donc le relevé réel tombe peu après minuit (et reste daté du bon jour). L'heure réelle est affichée dans l'appli.
on:
  schedule:
    - cron: "43 21 * * 2"  # vise mercredi 00:00 Paris en été (CEST) ; déclenché à 23:43
    - cron: "43 21 * * 6"  # vise dimanche 00:00 Paris en été
    - cron: "43 22 * * 2"  # vise mercredi 00:00 Paris en hiver (CET)
    - cron: "43 22 * * 6"  # vise dimanche 00:00 Paris en hiver
  workflow_dispatch:
    inputs:
      only:
        description: "'achievements' = seulement les succès Steam détaillés (aucun relevé d'historique)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          off=$(TZ=Europe/Paris date +%z); s="${{ github.event.schedule }}"
          if [ -z "$s" ] || { [ "$off" = "+0200" ] && { [ "$s" = "43 21 * * 2" ] || [ "$s" = "43 21 * * 6" ]; }; } || { [ "$off" = "+0100" ] && { [ "$s" = "43 22 * * 2" ] || [ "$s" = "43 22 * * 6" ]; }; }; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true' && inputs.only != 'achievements'
        run: python3 fetch_stats.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          TZ: Europe/Paris
      - if: steps.gate.outputs.run == 'true' && inputs.only != 'achievements'
        run: python3 tools/fetch_store.py || echo "store fetch failed"
      - if: steps.gate.outputs.run == 'true' && inputs.only != 'achievements'
        run: python3 tools/fetch_ballchasing.py || echo "ballchasing failed"
        env:
          BALLCHASING_API_KEY: ${{ secrets.BALLCHASING_API_KEY }}
          TZ: Europe/Paris
      - if: steps.gate.outputs.run == 'true'
        run: python3 tools/fetch_steam_ach.py || echo "steam achievements failed"
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/build_home.py
          git add -A history *_latest.json store.json valorant.json ballchasing_latest.json steam_achievements.json home.json build.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -I)"
          git pull --rebase -q && git push
