name: Valorant + Rocket League (HenrikDev, ballchasing)
on:
  schedule:
    - cron: "0 16 * * *"   # 18:00 Paris en été (CEST, +0200)
    - cron: "0 23 * * *"   # 01:00 Paris en été
    - cron: "0 17 * * *"   # 18:00 Paris en hiver (CET, +0100)
    - cron: "0 0 * * *"    # 01:00 Paris en hiver
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  valorant:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          off=$(TZ=Europe/Paris date +%z); s="${{ github.event.schedule }}"
          if [ -z "$s" ] || { [ "$off" = "+0200" ] && { [ "$s" = "0 16 * * *" ] || [ "$s" = "0 23 * * *" ]; }; } || { [ "$off" = "+0100" ] && { [ "$s" = "0 17 * * *" ] || [ "$s" = "0 0 * * *" ]; }; }; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        run: python3 tools/fetch_valorant.py
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          TZ: Europe/Paris
      - if: steps.gate.outputs.run == 'true'
        run: python3 tools/fetch_ballchasing.py || echo "ballchasing failed (données conservées)"
        env:
          BALLCHASING_API_KEY: ${{ secrets.BALLCHASING_API_KEY }}
          TZ: Europe/Paris
      - if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add valorant.json ballchasing_latest.json history/ballchasing.jsonl
          git diff --cached --quiet || git commit -m "Valorant $(date -I)"
          git pull --rebase -q && git push
