name: Valorant (HenrikDev)
on:
  schedule:
    - cron: "15 6 * * *"    # ≈ 8 h Paris
    - cron: "15 21 * * *"   # ≈ 23 h Paris
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  valorant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_valorant.py
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          TZ: Europe/Paris
      - run: |
          git config user.name "gaming-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add valorant.json
          git diff --cached --quiet || git commit -m "Valorant $(date -I)"
          git pull --rebase -q && git push
