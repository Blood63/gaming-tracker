name: Replays locaux
# Déclenché quand l'outil du PC (tools/rl-uploader) pousse rl_local/index.json : fusionne ces replays (analysés sur le PC)
# dans ballchasing_latest.json (sans doublon avec ballchasing), génère l'index léger + les détails (rl_local/summary.json au format tableau, deep.json : chargement rapide de l'appli),
# puis régénère home.json. Aucune clé ballchasing nécessaire. index.json (écrit par le PC) n'est jamais modifié par le robot.
on:
  push:
    branches: [main]
    paths: ["rl_local/index.json", "tools/merge_rl_local.py", "tools/split_rl_index.py", "tools/tabpack.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false, queue: max }
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tools/push_data.sh relance merge_rl_local + split_rl_index + build_home à chaque essai, puis vérifie le commit sur origin/main.
      - env: { TZ: Europe/Paris, ADD: "ballchasing_latest.json" }
        run: |
          MSG="Replays locaux : fusion" bash tools/push_data.sh
      # Garde-fou : summary.json / deep.json / build.json publiés doivent correspondre à l'index.json publié, sinon job rouge.
      - run: |
          git fetch -q origin main && git reset -q --hard origin/main
          python3 tools/check_data.py || { echo "::error::rl_local/summary.json ou dérivés pas à jour sur main : les nouveaux replays ne s'afficheraient pas"; exit 1; }
