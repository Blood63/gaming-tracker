name: Rocket League rang
# Déclenché par le formulaire (étiquette « rl-rank ») OU par le titre (« Rocket League – rang… ») : l'appli GitHub mobile ne garde que le titre.
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue: { description: "Numéro de l'issue à traiter", required: true }
permissions:
  contents: write
  issues: write
jobs:
  run:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Blood63') ||
      (github.event.issue.user.login == 'Blood63' && github.event.sender.login == 'Blood63' &&
       (contains(github.event.issue.labels.*.name, 'rl-rank') || startsWith(github.event.issue.title, 'Rocket League – rang')))
    runs-on: ubuntu-latest
    concurrency: { group: data-commit, cancel-in-progress: false, queue: max }
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", N: "${{ github.event.issue.number || inputs.issue }}" }
    steps:
      - uses: actions/checkout@v5
      - id: ev
        run: |
          gh api repos/${{ github.repository }}/issues/$N > issue.json
          python3 -c "import json;i=json.load(open('issue.json'));assert i['user']['login']=='Blood63','auteur non autorisé';json.dump({'issue':i},open('ev.json','w'))"
          echo "state=$(python3 -c "import json;print(json.load(open('issue.json'))['state'])")" >> "$GITHUB_OUTPUT"
      - if: steps.ev.outputs.state == 'open'
        run: gh issue edit $N -R ${{ github.repository }} --add-label rl-rank || true
      # File partagée « data-commit » (queue: max : les exécutions en attente ne sont plus annulées) + publication vérifiée
      # (tools/push_data.sh : 5 essais sur la dernière version de main, check_data.py, commit présent sur origin/main).
      # L'issue n'est fermée que si la donnée est réellement publiée (ou déjà présente).
      - id: run
        if: steps.ev.outputs.state == 'open'
        env: { GT_EVENT: ev.json, COMMENT_FILE: comment.md, TZ: Europe/Paris, ADD: "rocket_league.json", REGEN: "python3 tools/rl_rank_intake.py > res.txt" }
        run: |
          rc=0; MSG="Rang RL : issue #$N" bash tools/push_data.sh || rc=$?
          echo "res=$(cat res.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
          exit $rc
      - if: always() && steps.ev.outputs.state == 'open'
        run: |
          if [ "${{ steps.run.outputs.status }}" != "pushed" ] && [ "${{ steps.run.outputs.status }}" != "nochange" ]; then
            printf '❌ Intégration NON publiée (envoi vers le dépôt refusé ou contrôle des données en échec). Rien n’est perdu : l’issue reste ouverte, relance ce workflow (Actions → Run workflow, numéro %s).\n' "$N" > comment.md
          fi
          gh issue comment $N -R ${{ github.repository }} -F comment.md
          if [ "${{ steps.run.outputs.res }}" = "OK" ] && { [ "${{ steps.run.outputs.status }}" = "pushed" ] || [ "${{ steps.run.outputs.status }}" = "nochange" ]; }; then gh issue close $N -R ${{ github.repository }} --reason completed; fi
