name: Tests
# Tests unitaires : node --test et unittest. Pas lancé sur un simple push de données (replays, relevés).
on:
  push:
    # branches : sans ce filtre, une poussée d'étiquette (sauvegarde backup-*) lance les tests (les filtres de chemins sont ignorés pour les étiquettes)
    branches: ["**"]
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
  # contrôle hebdomadaire des données publiées (doublons, vie privée, secrets) : les poussées de données des robots ne lancent pas ce workflow
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --check core.js && node --check app.js
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 tools/check_data.py
      # contrat de versionnage : index.html cohérent ; tout fichier de l'appli modifié depuis le dernier push doit avoir un nouveau ?v=
      - name: Numéros de version (?v=)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && ! printf %s "$BASE" | grep -qE '^0+$'; then git fetch -q --depth=1 origin "$BASE" || true; fi
          python3 tools/check_versions.py "$BASE"
  # Analyseur Rust des replays (top 15 n°9) : tests sans corpus (codes de sortie, index-merge, tests purs) + clippy sans avertissement.
  # Les tests « golden » restent sur la machine de build (RL_TEST_DIR) : aucun .replay n'est publié.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rl-analyzer
    steps:
      - uses: actions/checkout@v5
      # rustup lit rust-toolchain.toml (version épinglée + clippy)
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings
