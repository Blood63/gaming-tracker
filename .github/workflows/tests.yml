name: Tests
# Tests unitaires des fonctions de calcul (core.js) : node --test, sans navigateur.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check core.js && node --check app.js
      - run: node --test tests/
