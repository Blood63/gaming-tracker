name: Tests
# Tests unitaires : node --test et unittest. Pas lancé sur un simple push de données (replays, relevés).
on:
  push:
    # branches : sans ce filtre, une poussée d'étiquette (sauvegarde backup-*) lance les tests (les filtres de chemins sont ignorés pour les étiquettes)
    branches: ["**"]
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
  # contrôle hebdomadaire des données publiées (doublons, vie privée, secrets) : les poussées de données des robots ne lancent pas ce workflow
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --check core.js && node --check app.js
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: python3 tools/check_data.py
