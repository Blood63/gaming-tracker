name: Tests
# Tests unitaires : node --test et unittest. Pas lancé sur un simple push de données (replays, relevés).
on:
  push:
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app.js"
      - "core.js"
      - "app.css"
      - "sw.js"
      - "index.html"
      - "fetch_stats.py"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check core.js && node --check app.js
      - run: node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p "test_*.py"
