name: Résumé accueil (home.json)
# Régénère home.json + build.json quand des données sont modifiées à la main (push).
# Les robots les régénèrent eux-mêmes ; leurs push (GITHUB_TOKEN) ne relancent pas ce workflow.
on:
  push:
    branches: [main]
    paths: ["history/**","*.json","!home.json","!build.json","tools/build_home.py","tools/tabpack.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false, queue: max }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { ADD: "home.json" }
        run: |
          MSG="Résumé accueil" bash tools/push_data.sh
