name: COD Mobile intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
jobs:
  intake:
    if: github.event.issue.user.login == 'Blood63' && github.event.sender.login == 'Blood63' && (contains(github.event.issue.labels.*.name, 'cod-mobile') || startsWith(github.event.issue.title, 'COD Mobile – partie'))
    concurrency: { group: repo-write, cancel-in-progress: false }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra
      - run: pip install -q pillow
      - run: python3 tools/cod_intake.py
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", COMMENT_FILE: comment.md, TZ: Europe/Paris, COD_PLAYER: NVCBlood }
      - run: |
          git config user.name "gaming-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add cod_mobile.json screenshots
          git diff --cached --quiet || git commit -m "COD Mobile: issue #${{ github.event.issue.number }}"
          git pull --rebase -q && git push
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} -F comment.md
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} --reason completed || true
