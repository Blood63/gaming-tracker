name: Objectif
# Déclenché par le formulaire (étiquette « objectif ») OU par le titre (« Objectif… ») : l'appli GitHub mobile ne garde que le titre.
# workflow_dispatch permet de retraiter une issue existante (numéro en entrée).
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue: { description: "Numéro de l'issue à traiter", required: true }
permissions:
  contents: write
  issues: write
jobs:
  run:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'Blood63') ||
      (github.event.issue.user.login == 'Blood63' && github.event.sender.login == 'Blood63' &&
       (contains(github.event.issue.labels.*.name, 'objectif') || startsWith(github.event.issue.title, 'Objectif')))
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", N: "${{ github.event.issue.number || inputs.issue }}" }
    steps:
      - uses: actions/checkout@v4
      - id: ev
        run: |
          gh api repos/${{ github.repository }}/issues/$N > issue.json
          python3 -c "import json;i=json.load(open('issue.json'));assert i['user']['login']=='Blood63','auteur non autorisé';json.dump({'issue':i},open('ev.json','w'))"
          echo "state=$(python3 -c "import json;print(json.load(open('issue.json'))['state'])")" >> "$GITHUB_OUTPUT"
      - if: steps.ev.outputs.state == 'open'
        run: gh issue edit $N -R ${{ github.repository }} --add-label objectif || true
      # Pas de file d'attente partagée (elle annule les exécutions en attente) : on rejoue sur la dernière version et on réessaie si le push est refusé.
      - id: run
        if: steps.ev.outputs.state == 'open'
        env: { GT_EVENT: ev.json, COMMENT_FILE: comment.md, TZ: Europe/Paris }
        run: |
          git config user.name "gaming-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            res=$(python3 tools/goal_intake.py)
            python3 tools/build_home.py >/dev/null
            git add goals.json home.json build.json
            if git diff --cached --quiet; then break; fi
            git commit -qm "Objectifs : issue #$N" && git push -q origin HEAD:main && break
            sleep $((RANDOM % 8 + 3))
          done
          echo "res=$res" >> "$GITHUB_OUTPUT"
      - if: steps.ev.outputs.state == 'open'
        run: |
          gh issue comment $N -R ${{ github.repository }} -F comment.md
          if [ "${{ steps.run.outputs.res }}" = "OK" ]; then gh issue close $N -R ${{ github.repository }} --reason completed; fi
