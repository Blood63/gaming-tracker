name: Objectif
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
concurrency: { group: cod-intake, cancel-in-progress: false }
jobs:
  goal:
    if: github.event.issue.user.login == 'Blood63' && github.event.sender.login == 'Blood63' && contains(github.event.issue.labels.*.name, 'objectif')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: echo "res=$(python3 tools/goal_intake.py)" >> "$GITHUB_OUTPUT"
        env: { GITHUB_EVENT_PATH: "${{ github.event_path }}", COMMENT_FILE: comment.md }
      - run: |
          git config user.name "gaming-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add goals.json
          git diff --cached --quiet || git commit -m "Objectifs : issue #${{ github.event.issue.number }}"
          git pull --rebase -q && git push
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} -F comment.md
          if [ "${{ steps.run.outputs.res }}" = "OK" ]; then gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} --reason completed; fi
